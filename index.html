<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BleauWeb Apps</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f6fb;
    --card: #ffffff;
    --ink: #1c1b22;
    --muted: #5c5966;
    --accent: #6d3df0;
    --rule: #e6e3ef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161c;
      --card: #211f28;
      --ink: #f0eef6;
      --muted: #a49fb3;
      --accent: #a78bfa;
      --rule: #322f3d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 40rem;
    margin: 0 auto;
    padding: 3.5rem 1.25rem 4rem;
  }
  h1 { font-size: 1.8rem; margin: 0 0 .4rem; }
  .tagline { color: var(--muted); margin: 0 0 2rem; }
  ul.apps { list-style: none; padding: 0; margin: 0; }
  ul.apps li {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 14px;
    margin: .6rem 0;
  }
  ul.apps a {
    display: block;
    padding: 1rem 1.2rem;
    text-decoration: none;
  }
  ul.apps .name { color: var(--accent); font-weight: 600; }
  ul.apps .about { color: var(--muted); font-size: .92rem; margin-top: .15rem; }
</style>
</head>
<body>
<main>
  <h1>BleauWeb Apps</h1>
  <p class="tagline">Documents and policies for BleauWeb's iOS apps.</p>
  <ul class="apps">
    <li>
      <a href="neuroutine/">
        <div class="name">NeuRoutine</div>
        <div class="about">A calm, low-friction planner, designed neurodivergent-friendly first.</div>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
