# Publishes this whole repository as a static site on GitHub Pages.
#
# The repo is the site: one folder per iOS app (neuroutine/, and whatever
# comes next), each holding plain, self-contained HTML — no build step, no
# generator to keep in step. The App Store links to these pages (each app's
# privacy policy lives here), so a push to main is a deploy.
name: Publish pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository on first run, so there is no
          # one-time settings screen to remember.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
